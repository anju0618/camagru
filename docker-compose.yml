services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - storage:/srv/storage
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  storage:
